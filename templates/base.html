<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRUD Mahasiswa{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #e3e6ea;
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      --success-bg: #ecfdf3;
      --success-text: #166534;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
    header .wrap {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    .badge {
      font-size: .75rem; color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
    }
    main { padding: 24px 0 48px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: .92rem; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; font-size: .92rem; }
    .flash.success { background: var(--success-bg); color: var(--success-text); }
    .flash.error { background: var(--error-bg); color: var(--error-text); }
    .btn {
      display: inline-block; border: 1px solid transparent; border-radius: 8px;
      padding: 8px 14px; font-size: .9rem; font-weight: 600; cursor: pointer;
      text-decoration: none; background: var(--accent); color: #fff;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn.ghost:hover { background: var(--bg); }
    .btn.small { padding: 4px 10px; font-size: .82rem; }
    .btn.danger { background: transparent; color: var(--error-text); border-color: #f3c4c4; }
    .btn.danger:hover { background: var(--error-bg); }
    input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 8px; font-size: .95rem; font-family: inherit; background: #fff;
    }
    input:focus { outline: 2px solid #fca5a5; border-color: var(--accent); }
    footer { color: var(--muted); font-size: .8rem; text-align: center; padding-bottom: 24px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">CRUD <span>Mahasiswa</span></a>
      <span class="badge">Build #{{ app_version }}</span>
    </div>
  </header>
  <main>
    <div class="wrap">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for kategori, pesan in messages %}
          <div class="flash {{ kategori }}">{{ pesan }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer>Praktikum Komputasi Awan · Flask · PostgreSQL · Docker · Jenkins</footer>
</body>
</html>
